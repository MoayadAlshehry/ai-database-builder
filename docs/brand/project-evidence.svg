<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>AI Database Builder — Requirements become reviewable SQL</title><rect width="1600" height="900" fill="#F7F7F2"/><g font-family="Segoe UI, Arial, sans-serif"><text x="76" y="98" font-size="54" font-weight="700" fill="#17262D" >Requirements become reviewable SQL</text><text x="78" y="150" font-size="25" font-weight="400" fill="#4D6267" >Actual output from the bundled offline example</text><rect x="80" y="220" width="1440" height="390" rx="20" fill="#17262D"/><text x="112" y="278" font-size="25" font-weight="400" fill="#F7F7F2" font-family="Consolas, monospace">Proposed SQL (review before execution):</text><text x="112" y="321" font-size="25" font-weight="400" fill="#F7F7F2" font-family="Consolas, monospace">CREATE DATABASE `example_project`;</text><text x="112" y="364" font-size="25" font-weight="400" fill="#F7F7F2" font-family="Consolas, monospace">CREATE TABLE `example_project`.`projects` (`id` INT, `title` VARCHAR(200),</text><text x="112" y="407" font-size="25" font-weight="400" fill="#F7F7F2" font-family="Consolas, monospace">`created_at` DATETIME);</text><text x="112" y="450" font-size="25" font-weight="400" fill="#F7F7F2" font-family="Consolas, monospace"></text><text x="112" y="493" font-size="25" font-weight="400" fill="#F7F7F2" font-family="Consolas, monospace">Preview only. No database connection was made. Add --apply to enable creation.</text><text x="80" y="690" font-size="30" font-weight="400" fill="#4D6267" >Offline preview output • No database connection or model request</text><text x="78" y="852" font-size="24" font-weight="400" fill="#4D6267" >Java CLI · Review and approval before creation</text></g></svg>
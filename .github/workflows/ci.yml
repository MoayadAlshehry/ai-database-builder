name: Java checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fictional-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfictional-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode verify
        env:
          TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: fictional-ci-password
      - run: java -jar target/ai-database-builder-0.1.0-SNAPSHOT.jar --example
